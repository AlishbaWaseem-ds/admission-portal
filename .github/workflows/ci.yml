name: CI

# Runs on EVERY push to ANY branch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1. TEST
  test:
    name: Run automated tests
    # Default: GitHub-hosted runner (needs a tunnel to reach your PC).
    # Local runner option: create a repository VARIABLE named CI_RUNNER = self-hosted
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # A failing test makes this step exit 1 -> the test stage fails.
      # The JSON report is written even when tests fail.
      - name: Run automated tests
        run: python tools/run_tests.py --output test-report.json

      - name: Keep the report as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json
          if-no-files-found: error

  # ----------------------------------------------- 2. REPORT (pass AND fail)
  report:
    name: Deliver report (localhost + email)
    needs: test
    if: ${{ !cancelled() }}          # runs after passing AND failing tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the test report
        uses: actions/download-artifact@v4
        with:
          name: test-report

      - name: Send report to the local receiver
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: python tools/send_report.py test-report.json

      # BONUS: e-mail the report. Skipped automatically when secrets are not set.
      - name: E-mail the report
        if: ${{ always() }}
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python tools/email_report.py test-report.json

  # ---------------------------------------------- 3. BONUS: DEPLOY TO PAGES
  deploy:
    name: Deploy to GitHub Pages
    needs: test                       # only runs when ALL tests passed
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The demo uses the same colours file as the portal (static/colors.css).
      - name: Add shared colours to the demo
        run: cp static/colors.css static_demo/colors.css

      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: static_demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
